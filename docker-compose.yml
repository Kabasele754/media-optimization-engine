name: media-optimization-engine

x-app: &app
  build: .
  env_file: .env
  volumes:
    - media_data:/app/media
    - static_data:/app/staticfiles
    - config_data:/var/lib/media-engine/config
  environment:
    MEDIA_ENGINE_CONFIG_DIR: /var/lib/media-engine/config
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-media_engine}
      POSTGRES_USER: ${POSTGRES_USER:-media_engine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-media_engine}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-media_engine} -d ${POSTGRES_DB:-media_engine}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  django:
    <<: *app
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health/', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery:
    <<: *app
    command: celery -A config.celery worker -l INFO -Q celery,image_critical,image_normal,image_backfill --concurrency=2

  celery-beat:
    <<: *app
    command: celery -A config.celery beat -l INFO

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - django
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro

  minio:
    image: minio/minio:latest
    profiles: ["object-storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    profiles: ["object-storage"]
    depends_on:
      - minio
    entrypoint: /bin/sh
    command: -c "sleep 3; mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-minio123}; mc mb --ignore-existing local/${AWS_STORAGE_BUCKET_NAME:-media}; mc anonymous set download local/${AWS_STORAGE_BUCKET_NAME:-media}"

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  minio_data:
  prometheus_data:
  grafana_data:
  config_data:
