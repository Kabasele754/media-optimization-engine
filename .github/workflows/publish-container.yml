name: Publish container

on:
  workflow_dispatch:
  push:
    branches:
      - "release/docker-*"
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/kabasele754/media-optimization-engine

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install packaging
      - name: Read and validate package version
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          from packaging.version import Version
          value = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert pathlib.Path('VERSION').read_text().strip() == value, 'VERSION metadata mismatch'
          parsed = Version(value)
          stable = not (parsed.is_prerelease or parsed.is_devrelease)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'value={value}\nstable={str(stable).lower()}\n')
          print(f'Publishing {value}; update stable latest tag: {stable}')
          PY

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest,enable=${{ steps.version.outputs.stable == 'true' }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            MOE_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published image manifest
        env:
          VERSION: ${{ steps.version.outputs.value }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE_NAME@$DIGEST"
          printf '## MOE container published\n\nVersion: `%s`\n\nDigest: `%s`\n\nPrereleases do not replace `latest`.\n' "$VERSION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
