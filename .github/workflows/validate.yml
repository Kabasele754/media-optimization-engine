name: Validate
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q media_engine config
      - run: DJANGO_SETTINGS_MODULE=config.settings.dev python manage.py check
      - run: DJANGO_SETTINGS_MODULE=config.settings.dev python manage.py test media_engine
