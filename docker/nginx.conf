upstream media_engine_django {
    server django:8000;
}

server {
    listen 80;
    client_max_body_size 30m;

    location /media/media_engine/derivatives/ {
        alias /app/media/media_engine/derivatives/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /media/media_engine/panoramas/ {
        alias /app/media/media_engine/panoramas/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Originals are regeneration sources and are private by default.
    location /media/media_engine/originals/ {
        deny all;
        return 404;
    }

    location = /internal/metrics {
        return 404;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://media_engine_django;
    }
}
